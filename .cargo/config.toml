# `relative = true` resolves against this file's project root, so the bindings land in `src/types/` no matter whether cargo was invoked from the
# repository root (`pnpm types`) or from `src-tauri/` (the Tauri CLI). Only read when the `ts` feature is on; a normal build ignores it.
[env]
TS_RS_EXPORT_DIR = { value = "src/types", relative = true }
