[package]
name = "ShellyRGBAudio"
version = "0.1.0"
edition = "2024"
authors = ["SytxLabs"]
description = "A program that converts music played on Shelly devices into audio output using WASAPI."
license = "MIT"
repository = "https://github.com/SytxLabs/ShellyRGBAudio"
homepage = "https://sytxlabs.eu"
categories = ["audio", "multimedia", "wasapi", "shelly", "rgb"]
keywords = ["audio", "wasapi", "shelly", "rgb", "led"]
build = "build.rs"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rustfft = "6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
digest_auth = "0.3"
ctrlc = "3"

# Linux and macOS capture goes through cpal, which wraps ALSA and CoreAudio. Windows keeps its own WASAPI backend below: cpal cannot report the
# speaker channel mask, and loopback of an output device is a first class feature there rather than something to be found among the inputs.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
