[package]
name = "shellyrgbaudio"
version = "0.1.0"
description = "Turns what your computer plays into light on Shelly, WLED and Govee devices."
authors = ["SytxLabs"]
edition = "2024"
license = "MIT"
repository = "https://github.com/SytxLabs/ShellyRGBAudio"
homepage = "https://sytxlabs.eu"
build = "build.rs"

[lib]
name = "shellyrgbaudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Off by default: only `pnpm types` turns it on, so that the `#[ts(export)]` tests regenerate `src/types/`. The app itself never needs ts-rs.
ts = ["dep:ts-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

reqwest = { version = "0.13.5", features = ["blocking", "json"] }
rustfft = "6"
digest_auth = "0.3"

# `serde-json-impl` is what teaches ts-rs about the `serde_json::Value` fields that carry a device's free-form entry.
ts-rs = { version = "12", features = ["serde-json-impl"], optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
